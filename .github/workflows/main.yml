name: Continuous Data Feed Engine

on:
  schedule:
    - cron: '0 * * * *' # Triggers every hour perfectly on autopilot
  workflow_dispatch: # Keeps your manual testing button active

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants full permissions to write and save files back to your folder
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # CRITICAL UPGRADE: Pulls full deep branch history to completely clear Git 128 blocks

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: pip install requests

    - name: Execute Scraper Script
      run: python main.py

    - name: Save Data to Repository
      run: |
        git config --global user.name "Data-Bot-Engine"
        git config --global user.email "databot@anonymous.org"
        
        # Explicitly fetch changes to ensure local cloud index matches online repository
        git fetch origin main
        
        # Pull down remote changes safely via rebase to fully protect against conflicts
        git pull --rebase origin main
        
        # Force add the file to make sure it tracks updates cleanly 
        git add crypto_data_feed.csv
        
        # Commit if changes exist, exit quietly if already up to date
        if ! git diff --cached --quiet; then
          echo "New crypto market mutations detected. Syncing archive database..."
          git commit -m "Automated update: Logged data string [skip ci]"
          git push origin HEAD:main
        else
          echo "No historical variations found. Working tree is clean. Exiting cleanly!"
          exit 0
        fi
