name: Continuous Data Feed Engine

on:
  schedule:
    - cron: '0 * * * *' # Triggers every hour perfectly on autopilot
  workflow_dispatch: # Keeps your manual testing button active

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants full permissions to write and save files back to your folder
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # CRITICAL UPGRADE: Pulls full deep branch history to completely clear Git 128 blocks

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: pip install requests

    - name: Execute Scraper Script
      run: python main.py

    - name: Save Data to Repository
      run: |
        git config --global user.name "Data-Bot-Engine"
        git config --global user.email "databot@anonymous.org"
        
        # Explicitly pull remote updates first to keep the branch sync perfect
        git fetch origin main
        git pull --rebase origin main
        
        # Create an empty file with headers ONLY if the script failed to generate it due to an API block
        if [ ! -f crypto_data_feed.csv ]; then
          echo "Timestamp,Trend1_Name,Trend1_Symbol,Trend1_Rank,Trend1_Price,Trend2_Name,Trend2_Symbol,Trend2_Rank,Trend2_Price,Trend3_Name,Trend3_Symbol,Trend3_Rank,Trend3_Price" > crypto_data_feed.csv
        fi
        
        # Explicitly track the file safely without generating pathspec errors
        git add crypto_data_feed.csv
        
        # Commit if the script added new rows, otherwise exit cleanly with success
        if ! git diff --cached --quiet; then
          echo "New dynamic trending data logs detected. Saving..."
          git commit -m "Automated update: Logged data string [skip ci]"
          git push origin HEAD:main
        else
          echo "Working directory clean or API rate limit active. Exiting cleanly!"
          exit 0
        fi

          git push origin HEAD:main
        else
          echo "No historical variations found. Working tree is clean. Exiting cleanly!"
          exit 0
        fi
