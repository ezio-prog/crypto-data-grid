name: Continuous Data Feed Engine

on:
  schedule:
    - cron: '0 * * * *' # Tells GitHub to wake up and run exactly at the start of every hour on autopilot
  workflow_dispatch: # Gives you a manual button to test it instantly

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the server permission to save the data back into your repository folder
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Setup Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Scraping Dependencies
      run: pip install requests

    - name: Execute Scraper Script
      run: python main.py

    - name: Save Data to Repository
      run: |
        git config --global user.name "Data-Bot-Engine"
        git config --global user.email "databot@anonymous.org"
        
        # If your main.py writes a file, this saves it. If it prints to logs, it clears safely.
        git add -A
        git commit -m "Automated update: Logged data string [skip ci]" || echo "No changes to save"
        git push
