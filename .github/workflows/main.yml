name: Continuous Data Feed Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: |
        pip install requests

    - name: Execute Scraper Script
      run: python main.py

    - name: Save Data to Repository
      run: |
        git config --global user.name "Data-Bot-Engine"
        git config --global user.email "databot@anonymous.org"
        
        # Explicitly stage the CSV file directly instead of relying on parsing status strings
        git add crypto_data_feed.csv
        
        # Check if there is an active commit staged to save
        if ! git diff --cached --quiet; then
          echo "New data elements detected. Syncing archive..."
          git commit -m "Automated update: Logged data string [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
        else
          echo "No historical variations found. Exiting cleanly."
          exit 0
        fi
